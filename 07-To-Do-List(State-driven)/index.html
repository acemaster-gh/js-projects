<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Todo</title>
</head>

<body>

    <div class="app-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">

            <button id="toggle-sidebar" class="icon-btn">
                <i class='bx bx-menu'></i>
            </button>

            <div class="sidebar-header">
                <span>Menu</span>
            </div>

            <nav class="sidebar-nav">

                <ul>

                    <li>
                        <a href="#">
                            <i class='bx bx-home'></i>
                            <span>Home</span>
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <i class='bx bx-cog'></i>
                            <span>Settings</span>
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <i class='bx bx-user'></i>
                            <span>Contacts</span>
                        </a>
                    </li>

                </ul>

            </nav>

        </aside>

        <!-- MAIN -->
        <div class="main-wrapper">

            <!-- NAVBAR -->
            <nav class="top-navbar">

                <div class="search-container">
                    <input type="search" placeholder="Search">
                </div>

                <div class="nav-actions">

                    <button id="themeBtn">
                        <i class='bx bx-moon' id="themeIcon"></i>
                    </button>

                    <div class="account">
                        Account
                    </div>

                </div>

            </nav>

            <!-- CONTENT -->
            <main class="content-area">

                <h1 class="app-header">To-Do Dashboard</h1>
                <div class="todo-app">

                    <ul id="taskList"></ul>

                    <div class="bubble"> <textarea type="text" id="taskInput" placeholder="Add a task Here"></textarea>

                        <button id="addTaskBtn"><i class="bx bx-plus" style="color:white; font-size: 40px ;
                        "></i></button>
                    </div>


                </div>

            </main>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
