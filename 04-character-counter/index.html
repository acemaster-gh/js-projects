<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<label for="theme-toggle">Mode: </label>
<button id="theme-toggle">Switch to Dark Mode</button>
<div class="container">
    <h1>Character Counter</h1>
    <textarea name="Counter" id="text-input" maxlength="200"></textarea>
    <p>Total Character: <span id="char-count">0</span></p>
    <p>Remaining: <span id="remaining">200</span></p>

</div>

    <script src="script.js"></script>
</body>
</html>
