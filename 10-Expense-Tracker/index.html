<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>

        <h1 class="header">Budget Tracker</h1>

        <div class="income">
            <p>Income:</p><span class="income-amount" id="total-income"></span>
        </div>

        <div class="expense">
            <p>Expenses: </p>
            <span class="expense-amount" id="total-expense"></span>
        </div>

        <div class="balance">
            <p>Balance: </p>
            <span class="balance-amount" id="balance"></span>
        </div>

        <hr>
        <div class="amount-details">
            <input type="radio" name="type" id="income-radio" value="income" checked>
            <label for="income-radio">Income</label>


            <input type="radio" name="type" id="expense-radio" value="expense">
            <label for="expense-radio">Expense</label>
        </div>

        <div class="add-transaction">

            <input type="text" id="description" placeholder="Description...">
            <input type="number" id="amount" placeholder="Amount...">
            <button id="add-btn">Add Transaction</button>
        </div>
        <hr>
        <h2>TRANSACTIONS</h2>
        <ul id="transaction-list">

        </ul>

    </main>




    <script src="script.js"></script>
</body>

</html>
